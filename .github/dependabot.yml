version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  # The databases and base images stay on their LTS lines, so major versions are a decision.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # MongoDB 8.1 to 8.3 are short-lived releases, while 8.0 is the long-term line.
      - dependency-name: mongo
        versions: [">=8.1"]
  - package-ecosystem: docker
    directories:
      - /orchestration
      - /spark
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
