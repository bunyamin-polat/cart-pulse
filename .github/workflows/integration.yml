name: Integration

# Weekly and on demand, because this downloads the course data from an external host.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: cp .env.example .env
      - run: docker compose up --detach --wait mysql-etl postgres
      - run: make load-etl
      - name: First run moves the new rows
        run: make run-etl | tee first_run.txt
      - run: grep -q "inserted into production datawarehouse =  1650" first_run.txt
      - name: Second run moves nothing
        run: make run-etl | tee second_run.txt
      - run: grep -q "inserted into production datawarehouse =  0" second_run.txt
