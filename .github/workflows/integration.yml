name: Integration

# Weekly and on demand, because this builds large images and downloads the sample data.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: cp .env.example .env
      - run: make test-integration
      - run: make demo
      - run: make forecast
      - run: make search-terms
      - run: make airflow
      - name: Run the DAG in Airflow
        run: docker compose --profile airflow exec -T airflow airflow dags test cartpulse_daily
