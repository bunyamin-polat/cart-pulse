name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make lint
      - run: make test
      - name: Validate Compose file
        run: docker compose --env-file .env.example --profile airflow --profile spark config --quiet
      - name: Lint shell scripts
        run: find scripts orchestration -name '*.sh' -exec shellcheck {} +
