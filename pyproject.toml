[project]
name = "cartpulse-data-platform"
version = "0.1.0"
description = "End-to-end e-commerce data platform: OLTP, NoSQL, warehouse, ETL, BI and ML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mysql-connector-python>=26.10.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# I replaces isort; `ruff format` replaces black.
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
