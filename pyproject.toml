[project]
name = "cartpulse"
version = "0.1.0"
description = "E-commerce data platform: orders, catalog and web traffic to a tested warehouse and forecast."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mysql-connector-python>=26.10.0",
    "psycopg2-binary>=2.9.13",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: needs the running databases and sample data"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
known-third-party = ["airflow", "pyspark"]
known-first-party = ["cartpulse"]

[tool.ruff.lint]
# I replaces isort; `ruff format` replaces black.
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
