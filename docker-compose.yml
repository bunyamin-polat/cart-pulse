name: cartpulse

services:
  mysql:
    image: mysql:8.0.43
    container_name: cartpulse-mysql
    restart: unless-stopped
    # Started as root, the entrypoint chowns secure_file_priv and crashes on a read-only mount.
    user: mysql
    # MYSQL_DATABASE is left unset on purpose: creating `sales` is Exercise 2, Task 1.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    # Bound to localhost so the database is never exposed on the local network.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # /var/lib/mysql-files is the only path LOAD DATA INFILE may read (secure_file_priv).
      - ./modules/01-oltp-mysql/data:/var/lib/mysql-files:ro
    healthcheck:
      # TCP instead of the socket: the temporary server used during first-boot
      # initialization only listens on the socket, so this stays red until the real one is up.
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # The ETL lab imports its own sales.sales_data, which would clash with the Module 1 table.
  mysql-etl:
    image: mysql:8.0.43
    container_name: cartpulse-mysql-etl
    restart: unless-stopped
    user: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_ETL_PORT:-3307}:3306"
    volumes:
      - mysql_etl_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  mongo:
    image: mongo:7.0.14
    container_name: cartpulse-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./modules/02-nosql-mongodb/data:/import:ro
    healthcheck:
      # ping needs no authentication, so the check never handles the password.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16.4
    container_name: cartpulse-postgres
    restart: unless-stopped
    # POSTGRES_DB is left unset on purpose: softcart and staging are created in the lab.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./modules/03-data-warehouse/data:/import:ro
      - ./modules/05-etl-airflow/data:/import-etl:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: cartpulse-pgadmin
    restart: unless-stopped
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Desktop mode skips the login screen, which is safe because the port is localhost-only.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./modules/03-data-warehouse/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.10.5
    container_name: cartpulse-airflow
    restart: unless-stopped
    profiles: [airflow]
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # New DAGs stay paused until they are unpaused on purpose.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8088}:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./modules/05-etl-airflow/dags:/opt/airflow/dags:ro
      - ./modules/05-etl-airflow/data:/opt/airflow/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Runs one job and exits, through `docker compose run`.
  spark:
    build: ./modules/06-spark-ml
    image: cartpulse-spark:4.2.0
    profiles: [spark]
    working_dir: /opt/cartpulse
    volumes:
      - ./modules/06-spark-ml/jobs:/opt/cartpulse/jobs:ro
      - ./modules/06-spark-ml/data:/opt/cartpulse/data

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: cartpulse-phpmyadmin
    restart: unless-stopped
    # Optional tooling: a profile keeps it out of a plain `docker compose up`.
    profiles: [admin]
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  mysql_etl_data:
  mongo_data:
  postgres_data:
  pgadmin_data:
  airflow_home:
