name: cartpulse

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    user: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: cartpulse
      MYSQL_USER: cartpulse
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    # Bound to localhost so the databases are never exposed on the local network.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/oltp:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP instead of the socket: the temporary server used during first-boot
      # initialization only listens on the socket, so this stays red until the real one is up.
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  mongo:
    image: mongo:9.0.4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      # The image declares this path too, and a named volume stops `make reset` leaving it behind.
      - mongo_config:/data/configdb
    healthcheck:
      # ping needs no authentication, so the check never handles the password.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: warehouse
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      # PostgreSQL 18 images keep their data in a versioned folder below this path.
      - postgres_data:/var/lib/postgresql
      - ./sql/warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--dbname=warehouse"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow:
    build: ./orchestration
    image: cartpulse-airflow:3.3.2
    restart: unless-stopped
    profiles: [airflow]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PYTHONPATH: /opt/cartpulse
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python /opt/cartpulse/metadata_url.py
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # The port is bound to localhost, so a local login adds nothing.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8088}:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./orchestration/dags:/opt/airflow/dags:ro
      - ./cartpulse:/opt/cartpulse/cartpulse:ro
      - ./sql:/opt/cartpulse/sql:ro
      - ./data/raw:/opt/cartpulse/data/raw:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Runs one job and exits, through `docker compose run`.
  spark:
    build: ./spark
    image: cartpulse-spark:4.3.0
    profiles: [spark]
    working_dir: /opt/cartpulse
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./spark/jobs:/opt/cartpulse/jobs:ro
      - ./data/raw:/opt/cartpulse/data/raw:ro

volumes:
  mysql_data:
  mongo_data:
  mongo_config:
  postgres_data:
  airflow_home:
